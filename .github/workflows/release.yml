name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            bin: tk
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: tk
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: tk
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: tk.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if command -v strip >/dev/null 2>&1; then
            strip "${BIN_PATH}" || true
          fi
          ARCHIVE_NAME="tk-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ASSET=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE_NAME="tk-${{ github.ref_name }}-${{ matrix.target }}.zip"
          7z a "${ARCHIVE_NAME}" "./target/${{ matrix.target }}/release/${{ matrix.bin }}"
          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ASSET=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tk-${{ github.ref_name }}-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
