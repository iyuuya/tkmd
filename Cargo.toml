[package]
name = "taskmd"
version = "0.1.0"
edition = "2024"
description = "Markdown Task & Project Manager for Developers and AI Agents"
license = "MIT OR Apache-2.0"
authors = ["Ken Harrison <ktreharrison@gmail.com>"]
repository = "https://github.com/ktreharrison/taskmd"

[[bin]]
name = "tk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
