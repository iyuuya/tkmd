<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="iconCritArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#ef4444" />
    </marker>
    <marker id="iconCyanArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#iconBg)" stroke="#334155" stroke-width="3" />

  <!-- Top Tab Window Controls -->
  <circle cx="44" cy="38" r="6" fill="#ef4444" />
  <circle cx="62" cy="38" r="6" fill="#f59e0b" />
  <circle cx="80" cy="38" r="6" fill="#10b981" />
  <text x="216" y="44" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#64748b" text-anchor="end">M↓</text>
  <line x1="8" y1="58" x2="248" y2="58" stroke="#1e293b" stroke-width="2" />

  <!-- AON Network Nodes -->
  <!-- Node A (Cyan Start) -->
  <rect x="36" y="85" width="56" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">A</text>

  <!-- Node B (Dashed Prereq) -->
  <rect x="36" y="160" width="56" height="42" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" />
  <text x="64" y="187" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#94a3b8" text-anchor="middle">B</text>

  <!-- Connector: B -> C (Light) -->
  <path d="M 92 181 C 122 181, 130 155, 158 145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#iconCyanArrow)" />

  <!-- Connector: A -> C (CRITICAL PATH: Thick Red Arrow + Glow) -->
  <path d="M 92 106 C 122 106, 130 130, 158 136" fill="none" stroke="#ef4444" stroke-width="4.5" marker-end="url(#iconCritArrow)" filter="url(#iconGlow)" />
  <path d="M 92 106 C 122 106, 130 130, 158 136" fill="none" stroke="#ef4444" stroke-width="4" />

  <!-- Target Node C (Critical Destination) -->
  <rect x="164" y="116" width="60" height="48" rx="12" fill="#181825" stroke="#ef4444" stroke-width="3.5" />
  <text x="194" y="147" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#f87171" text-anchor="middle">C</text>
  <circle cx="218" cy="116" r="6" fill="#ef4444" />
</svg>
