<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glowCrit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Critical Path Arrowhead Marker -->
    <marker id="critArrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#ef4444" />
    </marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="780" height="220" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtitle DSM Grid Pattern Overlay in Top Right -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="620" y1="30" x2="760" y2="30" />
    <line x1="620" y1="55" x2="760" y2="55" />
    <line x1="620" y1="80" x2="760" y2="80" />
    <line x1="620" y1="105" x2="760" y2="105" />
    <line x1="620" y1="30" x2="620" y2="105" />
    <line x1="655" y1="30" x2="655" y2="105" />
    <line x1="690" y1="30" x2="690" y2="105" />
    <line x1="725" y1="30" x2="725" y2="105" />
    <line x1="760" y1="30" x2="760" y2="105" />
  </g>

  <!-- ICON SECTION (Left) -->
  <g transform="translate(45, 35)">
    <!-- Outer Card Geometry -->
    <rect x="0" y="0" width="170" height="170" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Card Top Header Tab -->
    <path d="M 0 14 C 0 6 6 0 14 0 L 156 0 C 164 0 170 6 170 14 L 170 32 L 0 32 Z" fill="#1e293b" />
    <!-- Three Window Controls -->
    <circle cx="16" cy="16" r="4" fill="#ef4444" />
    <circle cx="28" cy="16" r="4" fill="#f59e0b" />
    <circle cx="40" cy="16" r="4" fill="#10b981" />
    <!-- Markdown "M↓" Emblem inside Tab -->
    <text x="142" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', 'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#64748b">M↓</text>

    <!-- Network Graph: Activity-On-Node (AON) DAG + Critical Path -->
    <!-- Node A (Predecessor 1 - Cyan) -->
    <rect x="18" y="50" width="42" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="39" y="69" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">A</text>

    <!-- Node B (Predecessor 2 - Non-critical) -->
    <rect x="18" y="105" width="42" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="39" y="125" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">B</text>

    <!-- Connector: B -> C (Non-critical, light arrow) -->
    <path d="M 60 121 C 80 121, 85 102, 106 94" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#cyanArrow)" />

    <!-- Connector: A -> C (CRITICAL PATH: Thick Red Arrow + Glow) -->
    <path d="M 60 66 C 82 66, 85 82, 106 87" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#critArrow)" filter="url(#glowCrit)" />
    <path d="M 60 66 C 82 66, 85 82, 106 87" fill="none" stroke="#ef4444" stroke-width="3" />

    <!-- Target Node C (Critical Node - Red Accent) -->
    <rect x="110" y="73" width="46" height="36" rx="6" fill="#1e1e2e" stroke="#ef4444" stroke-width="2.5" />
    <text x="133" y="95" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#f87171" text-anchor="middle">C</text>
    <!-- Zero Slack Indicator Badge -->
    <circle cx="152" cy="74" r="5" fill="#ef4444" />
  </g>

  <!-- TYPOGRAPHY SECTION (Right) -->
  <g transform="translate(255, 60)">
    <!-- Main Title -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="#f8fafc">
      tk<tspan fill="#38bdf8">md</tspan>
    </text>

    <!-- Primary Tagline -->
    <text x="2" y="82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="0.2" fill="#94a3b8">
      Deterministic Program Engine for Human + AI Teams
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 104)">
      <!-- Pill 1: CPM / DAG Engine -->
      <rect x="0" y="0" width="126" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#ef4444" />
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">CPM / DSM DAG</text>

      <!-- Pill 2: Multi-Agent MCP -->
      <rect x="136" y="0" width="134" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="148" cy="12" r="3.5" fill="#38bdf8" />
      <text x="160" y="16" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">Multi-Agent MCP</text>

      <!-- Pill 3: 100% Local -->
      <rect x="280" y="0" width="112" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="292" cy="12" r="3.5" fill="#a855f7" />
      <text x="304" y="16" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">100% Local</text>

      <!-- Pill 4: Rust 2.5MB -->
      <rect x="414" y="0" width="92" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="426" cy="12" r="3.5" fill="#10b981" />
      <text x="438" y="16" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">2.5MB Rust</text>
    </g>
  </g>
</svg>
